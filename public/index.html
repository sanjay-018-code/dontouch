<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don't Press It!</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1><span class="bolt">⚡</span> DON'T PRESS IT!</h1>
      <p>A chaotic reaction game for a room full of phones.</p>
    </div>

    <div class="choice-row">
      <button class="choice-btn" onclick="location.href='/organizer.html'">
        <div class="label">🖥️ Host a game</div>
        <div class="sub">Create a room, control settings, run it on the big screen.</div>
      </button>
      <button class="choice-btn" onclick="location.href='/player.html'">
        <div class="label">📱 Join a game</div>
        <div class="sub">Enter a room code from the host and get your button ready.</div>
      </button>
    </div>
  </div>
</body>
</html>
